<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUNA 扫码入口</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f23;color:#f0e6d3;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.card{text-align:center;padding:32px;max-width:400px}
h1{font-family:'Courier New',monospace;color:#e8b86d;font-size:36px;letter-spacing:10px;margin-bottom:4px}
.sub{color:#6a6a7e;font-size:13px;margin-bottom:28px}
.qr-box{display:inline-block;background:#fff;padding:14px;border-radius:14px;margin-bottom:20px;line-height:0}
.qr-box img{width:230px;height:230px}
.url-text{font-size:12px;color:#a0a0b8;word-break:break-all;margin-bottom:20px;padding:8px 16px;background:rgba(255,255,255,0.04);border-radius:8px}
.hint{font-size:12px;color:#6a6a7e}
.hint span{color:#e8b86d}
</style>
</head>
<body>
<div class="card">
  <h1>LUNA</h1>
  <p class="sub">星光歌姬 · 扫码进入</p>
  <div class="qr-box">
    <img src="/qr-luna.svg" alt="QR Code" onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=230x230&data='+encodeURIComponent(location.origin+'/gift')">
  </div>
  <p class="url-text">http://192.168.0.24:3000/gift</p>
  <p class="hint">📱 手机扫描二维码即可打开<br>需连接 <span>同一 WiFi</span></p>
</div>
</body>
</html>
